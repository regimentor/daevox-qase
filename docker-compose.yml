services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: daevox
      POSTGRES_PASSWORD: daevox
      POSTGRES_DB: daevox
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daevox -d daevox']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ['postgres-data:/var/lib/postgresql/data']
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command:
      [
        'mini',
        '-dir=/data',
        '-ip=127.0.0.1',
        '-ip.bind=0.0.0.0',
        '-s3.port=8333',
        '-webdav=false',
        '-admin.ui=false',
        '-s3.port.iceberg=0',
        '-s3.port.lance=0',
      ]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-seaweed-local-user}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-replace-for-local-development}
      S3_BUCKET: ${S3_BUCKET:-daevox-attachments}
    ports: ['9000:8333']
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null http://127.0.0.1:8888/buckets/$${S3_BUCKET}/ &&
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/)" = 403 ]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes: ['seaweedfs-data:/data']
volumes:
  postgres-data:
  seaweedfs-data:
