services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: daevox
      POSTGRES_PASSWORD: daevox
      POSTGRES_DB: daevox
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daevox -d daevox']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ['postgres-data:/var/lib/postgresql/data']
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio-local-user
      MINIO_ROOT_PASSWORD: replace-for-local-development
    ports: ['9000:9000', '9001:9001']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ['minio-data:/data']
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ['/bin/sh', '-c']
    command:
      [
        'mc alias set local http://minio:9000 minio-local-user replace-for-local-development && mc mb --ignore-existing local/daevox-attachments && mc anonymous set none local/daevox-attachments',
      ]
volumes:
  postgres-data:
  minio-data:
