fragment TestStepFields on TestStep {
  id
  testCaseId
  position
  action
  testData
  expectedResult
  createdAt
  updatedAt
}
fragment TagFields on Tag {
  id
  projectId
  name
  createdAt
  updatedAt
}
fragment TestCaseFields on TestCase {
  id
  projectId
  suiteId
  caseNumber
  displayId
  title
  description
  preconditions
  postconditions
  priority
  severity
  type
  automationStatus
  assigneeId
  estimatedDurationSeconds
  createdBy
  archivedAt
  steps {
    ...TestStepFields
  }
  tags {
    ...TagFields
  }
  createdAt
  updatedAt
}
