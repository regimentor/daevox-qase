query SuiteTree($projectId: UUID!, $includeArchived: Boolean = false) {
  suiteTree(projectId: $projectId, includeArchived: $includeArchived) {
    ...SuiteFields
  }
}
query TestCases($projectId: UUID!, $filter: TestCaseFilter, $sort: TestCaseSort, $page: PageInput) {
  testCases(projectId: $projectId, filter: $filter, sort: $sort, page: $page) {
    items {
      ...TestCaseFields
    }
    pageInfo {
      limit
      offset
      total
    }
  }
}
query TestCase($id: UUID!) {
  testCase(id: $id) {
    ...TestCaseFields
  }
}
query Tags($projectId: UUID!) {
  tags(projectId: $projectId) {
    ...TagFields
  }
}
mutation CreateSuite(
  $projectId: UUID!
  $title: String!
  $parentId: UUID
  $description: String
  $preconditions: String
  $postconditions: String
  $position: Int
) {
  createTestSuite(
    projectId: $projectId
    title: $title
    parentId: $parentId
    description: $description
    preconditions: $preconditions
    postconditions: $postconditions
    position: $position
  ) {
    id
    title
    parentId
    position
    description
    preconditions
    postconditions
  }
}
mutation UpdateSuite($id: UUID!, $input: UpdateTestSuiteInput!) {
  updateTestSuite(id: $id, input: $input) {
    id
    title
    parentId
    description
    preconditions
    postconditions
  }
}
mutation ArchiveSuite($id: UUID!) {
  archiveTestSuite(id: $id) {
    id
    title
    parentId
    archivedAt
  }
}
mutation RestoreSuite($id: UUID!) {
  restoreTestSuite(id: $id) {
    id
    title
    parentId
    archivedAt
  }
}
query SuiteArchivePreview($id: UUID!) {
  suiteArchivePreview(id: $id) {
    suiteCount
    caseCount
    affectedPlans {
      planId
      title
      affectedCaseCount
    }
  }
}
mutation MoveSuite($suiteId: UUID!, $position: Int!, $parentId: UUID) {
  moveTestSuite(suiteId: $suiteId, position: $position, parentId: $parentId) {
    id
    parentId
    position
  }
}
mutation CreateTestCase($input: CreateTestCaseInput!) {
  createTestCase(input: $input) {
    ...TestCaseFields
  }
}
mutation UpdateTestCase($id: UUID!, $input: UpdateTestCaseInput!) {
  updateTestCase(id: $id, input: $input) {
    ...TestCaseFields
  }
}
mutation ReplaceTestCaseSteps($testCaseId: UUID!, $steps: [TestStepInput!]!) {
  replaceTestCaseSteps(testCaseId: $testCaseId, steps: $steps) {
    ...TestCaseFields
  }
}
mutation ReplaceTestCaseTags($testCaseId: UUID!, $tagIds: [UUID!]!) {
  replaceTestCaseTags(testCaseId: $testCaseId, tagIds: $tagIds) {
    ...TestCaseFields
  }
}
mutation ArchiveTestCase($id: UUID!) {
  archiveTestCase(id: $id) {
    ...TestCaseFields
  }
}
mutation RestoreTestCase($id: UUID!) {
  restoreTestCase(id: $id) {
    ...TestCaseFields
  }
}
query TestCaseArchivePreview($id: UUID!) {
  testCaseArchivePreview(id: $id) {
    suiteCount
    caseCount
    affectedPlans {
      planId
      title
      affectedCaseCount
    }
  }
}
mutation CreateTag($projectId: UUID!, $name: String!) {
  createTag(projectId: $projectId, name: $name) {
    ...TagFields
  }
}
