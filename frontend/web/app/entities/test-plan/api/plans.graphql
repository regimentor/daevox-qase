fragment PlanFields on TestPlan {
  id
  projectId
  title
  description
  createdBy
  createdAt
  updatedAt
  activeCaseCount
  archivedCaseCount
  manualCaseIds
  sourceSuites {
    id
    projectId
    parentId
    title
    description
    position
    archivedAt
    createdAt
    updatedAt
  }
  testCases {
    id
    displayId
    title
    suiteId
    priority
    severity
    type
    automationStatus
    updatedAt
  }
}
query TestPlans($projectId: UUID!, $page: PageInput) {
  testPlans(projectId: $projectId, page: $page) {
    items {
      ...PlanFields
    }
    pageInfo {
      limit
      offset
      total
    }
  }
}
query TestPlan($id: UUID!) {
  testPlan(id: $id) {
    ...PlanFields
  }
}
mutation CreateTestPlan(
  $projectId: UUID!
  $title: String!
  $description: String
  $testCaseIds: [UUID!]!
  $sourceSuiteIds: [UUID!]
) {
  createTestPlan(
    projectId: $projectId
    title: $title
    description: $description
    testCaseIds: $testCaseIds
    sourceSuiteIds: $sourceSuiteIds
  ) {
    ...PlanFields
  }
}
mutation UpdateTestPlan($id: UUID!, $input: UpdateTestPlanInput!) {
  updateTestPlan(id: $id, input: $input) {
    ...PlanFields
  }
}
mutation ReplaceTestPlanCases($testPlanId: UUID!, $testCaseIds: [UUID!]!) {
  replaceTestPlanCases(testPlanId: $testPlanId, testCaseIds: $testCaseIds) {
    ...PlanFields
  }
}
mutation ReplaceTestPlanSources(
  $testPlanId: UUID!
  $sourceSuiteIds: [UUID!]!
  $manualTestCaseIds: [UUID!]!
  $orderedTestCaseIds: [UUID!]!
) {
  replaceTestPlanSources(
    testPlanId: $testPlanId
    sourceSuiteIds: $sourceSuiteIds
    manualTestCaseIds: $manualTestCaseIds
    orderedTestCaseIds: $orderedTestCaseIds
  ) {
    testPlan {
      ...PlanFields
    }
    addedCaseCount
    removedCaseCount
    affectedPlans {
      planId
      title
      addedCaseCount
      removedCaseCount
    }
  }
}
query PlanSourceChangePreview($testPlanId: UUID!, $sourceSuiteIds: [UUID!]!) {
  planSourceChangePreview(testPlanId: $testPlanId, sourceSuiteIds: $sourceSuiteIds) {
    removedCaseCount
  }
}
mutation DeleteTestPlan($id: UUID!) {
  deleteTestPlan(id: $id)
}
