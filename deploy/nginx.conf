server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 26m;
  proxy_connect_timeout 10s;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /graphql {
    proxy_pass http://backend:3000/graphql;
  }

  location = /health/live {
    proxy_pass http://backend:3000/health/live;
  }

  location = /health/ready {
    proxy_pass http://backend:3000/health/ready;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Dedicated S3 origin: preserve the signed Host (including port), URI and query.
server {
  listen 9000;
  server_name _;
  client_max_body_size 26m;
  location / {
    proxy_pass http://seaweedfs:8333;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
